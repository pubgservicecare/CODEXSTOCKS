[package]
name = "codex-stocks"
version = "1.0.2"
description = "CODE X STOCKS - PUBG account inventory"
authors = ["CODE X STOCKS"]
edition = "2021"

[lib]
name = "codex_stocks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
